<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard ติดตามข่าวสารกองทัพบก โดย ศปส.ทบ.</title>

<!-- ⚠️ ต้องอยู่ก่อน style.css และต้องเป็น inline script (ไม่ใช่ app.js)
     ถ้าไปตั้ง data-theme ใน app.js ซึ่งโหลดท้ายหน้า ผู้ใช้โหมดมืดจะเห็น
     "แฟลชขาว" ทุกครั้งที่เปิดหน้า เพราะเบราว์เซอร์วาดพื้นสว่างไปแล้วก่อนสคริปต์รัน
     ลำดับตัดสิน: ค่าที่ผู้ใช้เคยเลือก → ค่าของเครื่อง (OS) → สว่าง -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('dashboardTheme'); } catch (e) { t = null; }
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<!-- ⚠️ ฟอนต์ Kanit เก็บไว้เอง (self-host) ตาม §17.1 ของ RTA Brand Design System
     ห้ามกลับไปใช้ Google Fonts CDN — หน่วยราชการหลายแห่งบล็อกโดเมนภายนอก
     และการเรียก CDN ส่ง IP ผู้ใช้ออกนอกประเทศ (ประเด็น PDPA)
     ประกาศ @font-face อยู่หัวไฟล์ style.css · ห้ามลบ fonts/LICENSE (SIL OFL 1.1)
     preload เฉพาะน้ำหนักที่เห็นทันทีในหน้าจอแรก: ไทย 400 (เนื้อหา) และ 600 (หัวข้อ) -->
<link rel="preload" href="fonts/kanit-thai-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/kanit-thai-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="chart.min.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>Dashboard ติดตามข่าวสารกองทัพบก โดย ศปส.ทบ.</h1>
        <p id="lastUpdated" class="last-updated">กำลังโหลด...</p>
        <!-- ⭐ เพิ่ม 8 ส.ค. 69 (S20) — บรรทัด "ตรวจสอบล่าสุด" แยกจาก "ข้อมูลล่าสุด" โดยตั้งใจ
             ข้อมูลล่าสุด  = ข่าวชิ้นใหม่ล่าสุดเข้ามาเมื่อไร  (นิ่งได้ ถ้าไม่มีข่าว)
             ตรวจสอบล่าสุด = ระบบไปดูชีตครั้งล่าสุดเมื่อไร   (ต้องขยับทุกชั่วโมง)
             ถ้าไม่มีไฟล์ heartbeat.json บรรทัดนี้จะถูกซ่อน ไม่ใช่ขึ้น error
             ⚠️ ใช้คลาส last-updated ตัวเดิมโดยตั้งใจ — ไม่เพิ่มคลาสใหม่ จะได้ไม่ต้องแตะ style.css
                และได้สีที่ถูกต้องทั้งโหมดมืดและโหมดสว่างฟรี ๆ (ตาม RTA-Brand-Design-System) -->
        <p id="lastChecked" class="last-updated" hidden></p>
      </div>

      <div class="topbar-tools">
        <div class="fontsize-bar" role="group" aria-label="ปรับขนาดตัวอักษร">
          <span class="fontsize-label">ขนาดตัวอักษร</span>
          <div class="fontsize-btns">
            <button type="button" class="fontsize-btn" data-fontscale="1">ปกติ</button>
            <button type="button" class="fontsize-btn" data-fontscale="1.15">ใหญ่</button>
            <button type="button" class="fontsize-btn" data-fontscale="1.3">ใหญ่มาก</button>
          </div>
        </div>

        <button type="button" class="theme-btn" id="themeBtn" aria-label="สลับโหมดมืด/สว่าง"></button>
      </div>
    </div>
  </header>

  <main class="container">

    <div class="tab-bar">
      <button type="button" class="tab-btn active" id="tabListBtn">📋 รายการข่าว</button>
      <button type="button" class="tab-btn" id="tabChartsBtn">📊 กราฟสรุป</button>
    </div>

    <div id="listView">

      <section id="statGrid" class="stat-grid"></section>

      <section class="filter-bar">
        <input type="text" id="searchInput" placeholder="ค้นหาหัวข้อ/เนื้อหา/แหล่งข่าว..." />

        <div class="filter-row">
          <div class="multiselect" id="categoryMultiselect">
            <button type="button" class="multiselect-toggle" id="categoryToggle">ทุกหมวด ▾</button>
            <div class="multiselect-panel" id="categoryPanel" hidden></div>
          </div>

          <div class="multiselect" id="sourceMultiselect">
            <button type="button" class="multiselect-toggle" id="sourceToggle">ทุกสำนักข่าว ▾</button>
            <div class="multiselect-panel" id="sourcePanel" hidden></div>
          </div>

          <label class="checkbox-label neg-filter"><input type="checkbox" id="onlyNegative"> เฉพาะข่าวลบ</label>
        </div>

        <div class="filter-row">
          <select id="sortOrder">
            <option value="desc">ใหม่ล่าสุดก่อน</option>
            <option value="asc">เก่าสุดก่อน</option>
            <option value="count">นำเสนอมากสุดก่อน</option>
          </select>
        </div>

        <div class="filter-row">
          <label class="date-label">จาก <input type="date" id="dateFrom"></label>
          <label class="date-label">ถึง <input type="date" id="dateTo"></label>
        </div>

        <div class="filter-row">
          <label class="checkbox-label"><input type="checkbox" id="onlyToday"> ข่าววันนี้</label>
          <label class="checkbox-label"><input type="checkbox" id="onlyLast3Days"> ข่าว 3 วันย้อนหลัง</label>
          <button id="clearFiltersBtn" class="clear-btn">✕ ล้างตัวกรองทั้งหมด</button>
          <button id="exportBtn" class="export-btn">⬇ ส่งออก CSV</button>
        </div>
      </section>

      <p id="resultCount" class="result-count"></p>

      <section id="resultsGrid" class="results-grid">
        <div class="loading">กำลังโหลดข้อมูล...</div>
      </section>

    </div>

    <div id="chartsView" style="display:none">

      <section id="chartStatGrid" class="stat-grid"></section>

      <div class="chart-grid">
        <div class="chart-card">
          <p class="chart-title">หมวดข่าว · แยกข่าวลบ / ข่าวอื่นๆ</p>
          <div class="chart-canvas-wrap rows10"><canvas id="categoryBar"></canvas></div>
        </div>
        <div class="chart-card">
          <p class="chart-title">สำนักข่าวยอดนิยม (Top 10 · 14 วันล่าสุด)</p>
          <div class="chart-canvas-wrap rows10"><canvas id="sourceBar"></canvas></div>
        </div>
      </div>

      <div class="chart-card">
        <p class="chart-title">แนวโน้มข่าวรายวัน 14 วันล่าสุด</p>
        <div class="chart-canvas-wrap tall"><canvas id="trendBar"></canvas></div>
      </div>

    </div>

  </main>

  <footer class="footer">
    <p>ออกแบบและพัฒนาระบบโดย ทีมโฆษกกองทัพบก</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
