name: Update news data

# ============================================================
# ⭐ ยกเครื่องวงรอบอัปเดต 4 ส.ค. 69 — เลิกอิงนาฬิกา หันมาอิงลำดับเหตุการณ์
#
# ตัวสั่งอัปเดต "ตัวหลัก" ไม่ใช่ cron อีกต่อไป แต่เป็น Apps Script
#   hourlyScanJob จบ → ensureGroupedAndClassified() → pushWebsiteUpdate_() → สั่ง workflow นี้
# เพราะ ณ วินาทีที่ hourlyScanJob จบ แถวข่าวสมบูรณ์ครบทุกช่องที่เว็บใช้พอดี
#   (assignEventGroups เขียน N/R/S · classifyNewsByGroup เขียน G-K/M/P)
# ส่วนรายงาน LINE เขียนลงชีตแค่คอลัมน์ L (ธงรายงาน) ซึ่งเว็บไม่ได้อ่าน
#   → เว็บที่อัปเดตหลัง hourlyScanJob จึงมีข้อมูลเท่ากับที่รายงาน LINE เห็นเสมอ
#   → รายงานจะส่งเวลาไหนในชั่วโมงนั้นก็ไม่สำคัญอีกต่อไป
#
# ⚠️ ปัญหาเดิมที่วิธีนี้แก้ได้: trigger รายงานของ Apps Script (atHour) สุ่มภายในช่วง 1 ชั่วโมง
#    และ cron ของ GitHub หน่วงคิวได้จริง (วัดได้ 26 นาที เมื่อ 4 ส.ค. 69)
#    การพยายามตั้งเวลา 2 ฝั่งให้ตรงกันจึงเป็นการเดา ไม่ใช่การรับประกัน
#
# 🔴 ถอด schedule (cron) ออกทั้งหมดแล้ว 4 ส.ค. 69 — จงใจ ไม่ใช่ลืม
#
#   เหตุผล: ไล่ดูทีละฉากแล้ว cron ช่วยได้จริงแค่ฉากเดียวจาก 5 ฉาก คือ "token หมดอายุ"
#     • Apps Script trigger หยุด  → cron ไม่ช่วย เพราะชีตก็หยุดอัปเดตด้วย ไม่มีของใหม่ให้ดึง
#     • hourlyScanJob ล้มกลางคัน  → cron ไม่ช่วย ด้วยเหตุผลเดียวกัน รอบถัดไปเก็บเอง
#     • เน็ต/GitHub ล่มชั่วคราว   → ไม่ต้องพึ่ง cron รอบสแกนชั่วโมงหน้า push ให้เอง
#     • โควตา UrlFetch หมด        → แทบเป็นไปไม่ได้ (ใช้ ~210 จาก 20,000/วัน = 1%)
#   และการมีตัวสำรองยัง "ปิดบังอาการ" ด้วย — เว็บดูเหมือนยังอัปเดตอยู่ ทั้งที่ตัวหลักตายไปแล้ว
#
#   ⚠️ สิ่งที่มาแทน "ตัวสำรอง" คือ "ตัวส่งเสียง":
#      pushWebsiteUpdate_() ในฝั่ง Apps Script จะนับความล้มเหลวติดต่อกัน
#      ครบ 3 ครั้ง → ส่งข้อความแจ้งเตือนเข้ากลุ่ม LINE ทดสอบทันที แล้วย้ำทุก ๆ 24 ครั้ง
#      พอกลับมาสำเร็จก็ส่งข้อความบอกว่าปกติแล้ว
#      → ปัญหาถูก "แก้ให้หาย" แทนที่จะถูก "กลบให้ดูเหมือนไม่มี"
#
#   ผลที่ตามมาที่ต้องยอมรับ: ถ้า Apps Script สั่งไม่ได้ เว็บจะค้างอยู่ที่ข้อมูลชุดล่าสุด
#   ไม่มีอะไรมาอัปเดตให้เลย — แลกกับการที่จะรู้ตัวภายใน ~3 ชั่วโมงแทนที่จะไม่รู้เลย
#   (ป้าย "ข้อมูลล่าสุด" บนหน้าเว็บจะหยุดนิ่งด้วย เป็นสัญญาณชั้นที่สอง)
#
# กดรันเองได้ทันทีผ่านแท็บ Actions > Update news data > Run workflow
# ============================================================
on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'ยอมให้จำนวนข่าวลดลงเกิน 20% (ใช้เมื่อเพิ่งลบข่าวจำนวนมากในชีตเอง)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# ⭐ เพิ่ม 4 ส.ค. 69 — กันรอบซ้อนกัน
#    ถ้ารอบก่อนยังไม่จบแล้วรอบใหม่มาถึง ให้ต่อคิวรอ ไม่ใช่รันพร้อมกัน
#    รันพร้อมกัน 2 รอบ = git push ชนกัน รอบหลังล้มด้วย non-fast-forward
concurrency:
  group: update-news-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ ต้องเป็น @v5 ขึ้นไป 4 ส.ค. 69 — v4 เขียนให้รันบน Node 20 ซึ่ง GitHub กำลังถอดออก
      #    ตั้งแต่ 16 มิ.ย. 69 runner ใช้ Node 24 เป็นค่าตั้งต้น v4 จึงถูกบังคับรันพร้อมขึ้นเตือน
      #    และจะกลายเป็นล้มจริงช่วงปลายปี 2569 — v5 ประกาศ using: node24 มาแต่แรก
      - name: Checkout repo
        uses: actions/checkout@v5

      # ⚠️ node-version คนละเรื่องกับเวอร์ชัน action ข้างบน — ตัวนี้คือ Node ที่ใช้รัน npm run build
      #    Node 20 หมดอายุ (EOL) ไปแล้วตั้งแต่ 24 มี.ค. 69 = ไม่มี security patch แล้ว
      #    ขยับเป็น 24 ซึ่งเป็นสาย LTS ปัจจุบัน
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Fetch sheet data and build JSON
        run: npm run build
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          # ส่งต่อค่าจากช่องติ๊กตอนกด Run workflow — รอบตามเวลาจะได้ค่าว่าง = ไม่อนุญาต
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}

      # ⭐ แก้ 4 ส.ค. 69 (S19): เดิม generatedAt เปลี่ยนทุกรอบ ไฟล์จึงต่างทุกรอบ
      #    ตัวกัน "commit เฉพาะเมื่อเปลี่ยน" บรรทัดล่างจึงไม่เคยได้ทำงานเลย
      #    ตอนนี้ fetch-and-build.js จะไม่เขียนไฟล์ถ้าเนื้อข่าวเหมือนเดิม
      #    → git diff --staged --quiet จึงเป็นจริงได้จริง และรอบนั้นจะไม่ commit
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "⏸️ ข้อมูลไม่เปลี่ยนจากรอบก่อน — ไม่ commit"
            echo "⏸️ ข้อมูลไม่เปลี่ยนจากรอบก่อน — ไม่มี commit ในรอบนี้" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "อัปเดตข้อมูลข่าวอัตโนมัติ [skip ci]"
          # ดึงของใหม่บนรีโมตมารวมก่อน push กันชนกับ commit อื่นที่เพิ่งเข้ามา
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
          echo "✅ อัปเดต data/news.json แล้ว" >> "$GITHUB_STEP_SUMMARY"
